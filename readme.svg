<text x="340" y="235" fill="#f4f4f5" font-size="16" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><tspan x="340" y="235" class="glitch" fill="#f4f4f5">~/</tspan><tspan class="glitch" fill="#f4f4f5">andresblanco.site</tspan><tspan class="cursor" fill="#71717a">▌</tspan><tspan fill="#a1a1aa"> ───────────────────────────</tspan><tspan x="340" y="265" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">About</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Personal website & portfolio — Engineering as</tspan><tspan x="368.8" y="289" fill="#f4f4f5">/ a System. Real, traceable facts; no</tspan><tspan x="368.8" y="313" fill="#f4f4f5">gradients, / no fake metrics.</tspan><tspan x="340" y="337" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Type</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Web · SSG</tspan><tspan x="340" y="361" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Lang</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">TypeScript</tspan><tspan x="340" y="385" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Status</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Deployed</tspan><tspan x="340" y="409" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Author</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Andrés Blanco</tspan><tspan x="340" y="433" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Frontend</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Astro 7 · React 19 · Three.js</tspan><tspan x="340" y="457" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Design</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Tailwind v4 · GSAP</tspan><tspan x="340" y="481" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Data</tspan><tspan fill="#a1a1aa">: </tspan><tspan fill="#f4f4f5">Hipparcos · MDX</tspan><tspan x="340" y="511" fill="#f4f4f5"> ─── GitHub Stats ───</tspan><tspan x="340" y="535" fill="#a1a1aa">.</tspan><tspan fill="#f4f4f5">Stars</tspan><tspan fill="#a1a1aa">:  