<defs>
<style>
text { white-space: pre; }
.cursor { animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.rain { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; fill: #f4f4f5; opacity: 0; }
@keyframes fall {
  0%   { transform: translateY(-120%); opacity: 0; }
  10%  { opacity: 0.35; }
  90%  { opacity: 0.25; }
  100% { transform: translateY(120%); opacity: 0; }
}
.glitch { animation: glitch 3s steps(1) 1; }
@keyframes glitch {
  0%   { transform: translate(0); }
  5%   { transform: translate(-2px, 1px); }
  10%  { transform: translate(2px, -1px); }
  15%  { transform: translate(-1px, 0); }
  20%  { transform: translate(0); }
  100% { transform: translate(0); }
}
.comet { opacity: 0; }
.comet-1 { animation: comet1 5s ease-in-out infinite 0s; }
@keyframes comet1 {
  0% { transform: translate(860px, 40px); opacity: 0; }
  5% { opacity: 0.9; } 40% { opacity: 0.9; } 50% { opacity: 0; }
  100% { transform: translate(420px, 1800px); opacity: 0; } }
.comet-2 { animation: comet2 6s ease-in-out infinite 2s; }
@keyframes comet2 {
  0% { transform: translate(790px, 80px); opacity: 0; }
  5% { opacity: 0.8; } 35% { opacity: 0.8; } 45% { opacity: 0; }
  100% { transform: translate(350px, 1720px); opacity: 0; } }
.comet-3 { animation: comet3 7s ease-in-out infinite 4s; }
@keyframes comet3 {
  0% { transform: translate(920px, 20px); opacity: 0; }
  4% { opacity: 0.7; } 30% { opacity: 0.7; } 40% { opacity: 0; }
  100% { transform: translate(500px, 1880px); opacity: 0; } }

</style>
<linearGradient id="comet-trail" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#f4f4f5" stop-opacity="0"/>
  <stop offset="1" stop-color="#f4f4f5" stop-opacity="0.8"/>
</linearGradient>
